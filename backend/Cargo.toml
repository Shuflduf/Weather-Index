[package]
name = "weather-index"
version = "0.1.2"
edition = "2021"
description = "Weather Index backend API"
repository = "https://github.com/Shuflduf/Weather-Index"
license = "GPL-3.0-or-later"
default-run = "weather-index"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
better-auth-core = {
  git = "https://github.com/Shuflduf/better-auth-rs",
  branch = "master"
}
better-auth-hca = "0.1.2"
chrono = "0.4"
dotenvy = "0.15"
fake = { version = "5.1.0", features = ["chrono", "derive", "serde_json"] }
rand = "0.8.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
sqlx = "0.8.6"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dependencies.better-auth]
git = "https://github.com/Shuflduf/better-auth-rs"
branch = "master"
default-features = false
features = ["axum", "derive", "rustls", "sqlx-postgres"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]

[dependencies.sea-orm]
version = "2.0.0-rc"
features = [
  "entity-registry",
  "macros",
  "runtime-tokio-rustls",
  "schema-sync",
  "sqlx-postgres",
  "with-chrono",
]

[patch.crates-io]
better-auth = {
  git = "https://github.com/Shuflduf/better-auth-rs",
  branch = "master"
}
better-auth-api = {
  git = "https://github.com/Shuflduf/better-auth-rs",
  branch = "master"
}
better-auth-core = {
  git = "https://github.com/Shuflduf/better-auth-rs",
  branch = "master"
}
better-auth-derive = {
  git = "https://github.com/Shuflduf/better-auth-rs",
  branch = "master"
}

[package]
name = "weather-index"
version = "0.1.1"
default-run = "weather-index"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Shuflduf/Weather-Index"
description = "Weather Index backend API"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
better-auth-core = { git = "https://github.com/Shuflduf/better-auth-rs", branch = "master" }
chrono = "0.4"
dotenvy = "0.15"
fake = { version = "5.1.0", features = ["derive", "serde_json", "chrono"] }
rand = "0.8.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
sqlx = "0.8.6"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dependencies.better-auth]
git = "https://github.com/Shuflduf/better-auth-rs"
branch = "master"
default-features = false
features = ["axum", "derive", "rustls", "sqlx-postgres"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]

[dependencies.sea-orm]
version = "2.0.0-rc"
features = [
  "entity-registry",
  "macros",
  "runtime-tokio-rustls",
  "schema-sync",
  "sqlx-postgres",
  "with-chrono",
]
